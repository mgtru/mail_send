<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Рассылщик{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ваш кастом-CSS (если есть) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ───── NAVBAR ───── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">Email Sender</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link{% if request.endpoint=='index' %} active{% endif %}" href="{{ url_for('index') }}">Быстрая</a></li>
        <li class="nav-item"><a class="nav-link{% if request.blueprint=='accounts' %} active{% endif %}" href="{{ url_for('accounts.list_accounts') }}">Аккаунты</a></li>
        <li class="nav-item"><a class="nav-link{% if request.blueprint=='streams' %} active{% endif %}" href="{{ url_for('streams.list_') }}">Потоки</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('logs') }}">Логи</a></li>
      </ul>
    </div>
  </div>
</nav>
<!-- ────────────────── -->

<div class="container py-4" style="padding-top:5rem">
  {% block content %}{% endblock %}
</div>

<!-- JS-библиотеки (в указанном порядке!) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.1/dist/xlsx.full.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
